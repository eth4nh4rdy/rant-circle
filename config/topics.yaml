      - "Finding a decent place to live is so stressful."
      - "My neighbors are so loud, and I don't know what to do."

  - slug: military
    display_name: Military Service
    category: Military Service
    description: Anxiety or frustration related to mandatory military service — timing, experience, or re-adjustment afterward.
    phrase_hints:
      - "I don't know when I should go, and it's stressing me out."
      - "Getting back into normal life after service has been harder than I thought."

  - slug: exams
    display_name: Education & Exams
    category: Education & Exams
    description: Stress related to exams, grades, graduate school decisions, or competitive academic pressure.
