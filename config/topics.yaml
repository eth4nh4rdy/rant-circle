      - "I feel like I'm constantly being compared to other students."

  - slug: nunchi
    display_name: Nunchi (눈치)
    category: Social Pressure
    description: The pressure of constantly reading social cues, sensing others' moods, and adjusting behavior accordingly.
    phrase_hints:
      - "I'm always trying to figure out what everyone else is thinking."
      - "It's exhausting to constantly read the room like that."

